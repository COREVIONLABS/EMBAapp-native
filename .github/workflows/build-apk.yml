name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fetch Figma illustrations
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        continue-on-error: true
        run: python3 tools/fetch_figma_assets.py
      - name: Generate Android project
        run: flutter create --platforms=android --org de.schalke04 --project-name emba_app .
      - name: Use a stable signing key (so updates install over the old app)
        # Flutter release builds are signed with the debug signingConfig, whose
        # key normally lives at ~/.android/debug.keystore. On an ephemeral CI
        # runner that file is generated fresh (random key) every run, so each
        # APK gets a DIFFERENT signature and Android refuses to install it as an
        # update over a previously-installed build. Copying a committed keystore
        # in gives every build the SAME signature, so in-place updates work.
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - name: Enable edge-to-edge system bars (native theme)
        run: python3 tools/patch_edge_to_edge.py
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        # --build-number injects a strictly-increasing versionCode (CI run number)
        # so every published APK installs as an update over the previous one.
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emba-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish rolling Release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk emba-app.apk
          NOTES="Automatischer Build von Commit ${{ github.sha }} (Branch ${{ github.ref_name }})."
          TITLE="FC Schalke Club App — neuester Build"
          # Idempotent publish: if the "latest" release already exists (the
          # delete+create race previously failed here), just overwrite the
          # asset instead of failing the job.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest emba-app.apk --clobber
            gh release edit latest --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}"
          else
            gh release create latest emba-app.apk --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}"
          fi
