name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fetch Figma illustrations
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        continue-on-error: true
        run: python3 tools/fetch_figma_assets.py
      - name: Generate Android project
        run: flutter create --platforms=android --org de.schalke04 --project-name emba_app .
      - name: Enable edge-to-edge system bars (native theme)
        run: python3 tools/patch_edge_to_edge.py
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emba-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish rolling Release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk emba-app.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest emba-app.apk \
            --title "FC Schalke Club App — neuester Build" \
            --notes "Automatischer Build von Commit ${{ github.sha }} (Branch ${{ github.ref_name }})." \
            --target "${{ github.sha }}"
